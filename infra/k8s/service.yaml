apiVersion: v1
kind: Service
metadata:
  name: ragx-api
  namespace: ragx
  labels:
    app: ragx-api
spec:
  selector:
    app: ragx-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: ragx-frontend
  namespace: ragx
  labels:
    app: ragx-frontend
spec:
  selector:
    app: ragx-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  type: LoadBalancer
---
apiVersion: v1
kind: Namespace
metadata:
  name: ragx
